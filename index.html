<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICU Pre-Rounding Simulator</title>
<style>
  :root{
    --blue:#1a4f8b; --blue-dark:#123a68; --blue-light:#e8f0fa;
    --ink:#1c2733; --muted:#5b6b7c; --line:#d5dde6; --bg:#f2f5f8;
    --card:#ffffff; --accent:#0e7c66; --warn:#b3261e; --low:#1155cc;
    --gold:#8a6d00; --gold-bg:#fdf6df;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- header ---------- */
  #topbar{background:var(--blue); color:#fff; display:flex; align-items:center; gap:14px; padding:8px 16px; position:sticky; top:0; z-index:50;}
  #topbar h1{font-size:16px; font-weight:600; letter-spacing:.2px;}
  #topbar .sub{font-size:12px; opacity:.75;}
  #topbar .spacer{flex:1;}
  #timer{font-variant-numeric:tabular-nums; font-size:13px; background:rgba(255,255,255,.12); padding:3px 10px; border-radius:12px; display:none;}
  .topbtn{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:6px; padding:5px 12px; font-size:13px;}
  .topbtn:hover{background:rgba(255,255,255,.26);}

  /* ---------- generic ---------- */
  .wrap{max-width:1400px; margin:0 auto; padding:18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 2px rgba(20,40,70,.05);}
  h2{font-size:19px; margin-bottom:8px; color:var(--blue-dark);}
  h3{font-size:15px; margin-bottom:6px; color:var(--blue-dark);}
  p{margin-bottom:8px;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}
  ul.tight{margin:4px 0 8px 20px;}
  ul.tight li{margin-bottom:4px;}
  .btn{background:var(--blue); color:#fff; border:none; border-radius:7px; padding:9px 18px; font-size:14px; font-weight:600;}
  .btn:hover{background:var(--blue-dark);}
  .btn.secondary{background:#fff; color:var(--blue); border:1px solid var(--blue);}
  .btn.secondary:hover{background:var(--blue-light);}
  .btn.ghost{background:none; border:none; color:var(--muted); text-decoration:underline; font-weight:400; padding:6px;}
  .flag-H{color:var(--warn); font-weight:700;}
  .flag-L{color:var(--low); font-weight:700;}
  .flag-C{color:var(--warn); font-weight:700; background:#fdecea; padding:0 4px; border-radius:3px;}

  /* ---------- home ---------- */
  .case-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px;}
  .case-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:8px; box-shadow:0 1px 2px rgba(20,40,70,.05);}
  .case-card .bed{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
  .case-card .nm{font-size:17px; font-weight:700; color:var(--blue-dark);}
  .case-card .dx{font-size:13.5px; color:var(--ink);}
  .case-card .done-tag{font-size:12px; color:var(--accent); font-weight:600;}
  .case-card button{margin-top:auto;}
  details.framework{background:var(--blue-light); border:1px solid #c3d4ea; border-radius:10px; padding:12px 16px; margin-bottom:16px;}
  details.framework summary{cursor:pointer; font-weight:600; color:var(--blue-dark);}
  details.framework ol{margin:10px 0 4px 22px;}
  details.framework li{margin-bottom:5px;}

  /* ---------- sim layout ---------- */
  #banner{background:#fff; border-bottom:2px solid var(--blue); padding:8px 16px; display:flex; flex-wrap:wrap; gap:6px 22px; align-items:baseline; position:sticky; top:41px; z-index:40;}
  #banner .pname{font-size:17px; font-weight:700; color:var(--blue-dark);}
  #banner .bfield{font-size:12.5px; color:var(--muted);}
  #banner .bfield b{color:var(--ink); font-weight:600;}
  #banner .allergy{color:var(--warn); font-weight:700;}
  .sim-cols{display:flex; gap:0; align-items:stretch; height:calc(100vh - 118px);}
  #chartpane{flex:1.35; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--bg);}
  #tplpane{flex:1; min-width:340px; max-width:560px; display:flex; flex-direction:column; background:#fbfcfe;}
  .tabs{display:flex; flex-wrap:wrap; gap:2px; padding:8px 10px 0 10px; background:var(--bg); border-bottom:1px solid var(--line);}
  .tab{border:1px solid var(--line); border-bottom:none; background:#e6ebf1; color:var(--muted); padding:6px 12px; font-size:13px; border-radius:7px 7px 0 0;}
  .tab.active{background:#fff; color:var(--blue-dark); font-weight:600; border-color:#b9c6d4;}
  #tabbody{flex:1; overflow-y:auto; padding:14px 16px; background:#fff;}
  #tplpane .tpl-head{padding:10px 16px 6px 16px; border-bottom:1px solid var(--line); background:#fbfcfe;}
  #tplpane .tpl-head h3{margin-bottom:2px;}
  #tplbody{flex:1; overflow-y:auto; padding:12px 16px;}
  .tpl-field{margin-bottom:12px;}
  .tpl-field label{display:block; font-size:13px; font-weight:600; color:var(--blue-dark); margin-bottom:3px;}
  .tpl-field textarea{width:100%; min-height:64px; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font:inherit; font-size:13.5px; resize:vertical; background:#fff;}
  .tpl-field textarea:focus{outline:2px solid #9dbbe0; border-color:var(--blue);}
  #tplfoot{padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; background:#fbfcfe;}
  #savenote{font-size:12px; color:var(--muted);}

  /* ---------- chart content ---------- */
  table.chart{border-collapse:collapse; width:100%; font-size:13.5px; margin:8px 0 16px 0;}
  table.chart th{background:var(--blue-light); color:var(--blue-dark); text-align:left; padding:6px 9px; border:1px solid #c9d6e6; font-size:12.5px; white-space:nowrap;}
  table.chart td{padding:6px 9px; border:1px solid var(--line); vertical-align:top;}
  table.chart tr:nth-child(even) td{background:#f7f9fc;}
  .evt{display:flex; gap:12px; padding:8px 4px; border-bottom:1px solid #edf1f5;}
  .evt .t{font-variant-numeric:tabular-nums; font-weight:600; color:var(--blue-dark); min-width:52px; font-size:13px;}
  .evt .x{font-size:13.5px;}
  .kv{display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; font-size:13.5px; margin:6px 0 14px 0;}
  .kv dt{color:var(--muted); font-weight:600;}
  .med-sec{margin-bottom:14px;}
  .med-sec h4{font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:5px;}
  .med{padding:6px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:5px; font-size:13.5px; background:#fff;}
  .med b{color:var(--blue-dark);}
  .med .mnote{color:var(--muted); font-size:12.5px;}
  .note-card{border:1px solid var(--line); border-radius:8px; margin-bottom:12px; overflow:hidden;}
  .note-card .nh{background:var(--blue-light); padding:6px 12px; font-size:12.5px; color:var(--blue-dark); display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px;}
  .note-card .nb{padding:10px 12px; font-size:13.5px; white-space:pre-wrap;}

  /* ---------- score / checklist ---------- */
  .chk-cat{font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:14px 0 6px 0; border-bottom:1px solid var(--line); padding-bottom:3px;}
  .chk-item{display:flex; gap:10px; align-items:flex-start; padding:7px 8px; border-radius:7px; margin-bottom:4px;}
  .chk-item:hover{background:var(--blue-light);}
  .chk-item input{margin-top:4px; width:16px; height:16px; flex-shrink:0;}
  .chk-item label{font-size:14px; cursor:pointer;}
  .answers-review{background:#f7f9fc; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px;}
  .answers-review h4{font-size:13px; color:var(--blue-dark); margin:8px 0 2px 0;}
  .answers-review .ans{font-size:13px; white-space:pre-wrap; color:var(--ink);}
  .answers-review .ans.empty{color:#a3aeb9; font-style:italic;}
  .score-big{font-size:40px; font-weight:800; color:var(--blue-dark);}
  .missed{border-left:4px solid var(--warn); background:#fdf3f2; border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:10px;}
  .missed .mt{font-weight:600; margin-bottom:3px;}
  .missed .mw{font-size:13px; color:var(--muted);}
  .gotit{border-left:4px solid var(--accent); background:#eef8f5; border-radius:0 8px 8px 0; padding:8px 14px; margin-bottom:8px; font-size:14px;}
  .catbar{display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:13.5px;}
  .catbar .cb-label{min-width:170px; color:var(--muted);}
  .catbar .cb-track{flex:1; height:10px; background:#e3e9f0; border-radius:5px; overflow:hidden;}
  .catbar .cb-fill{display:block; height:100%; background:var(--blue); border-radius:5px;}
  .catbar .cb-num{min-width:44px; text-align:right; font-variant-numeric:tabular-nums;}

  /* ---------- facilitator ---------- */
  .fac-banner{background:var(--gold-bg); border:1px solid #e4d089; color:var(--gold); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; margin-bottom:14px;}
  .pearl{border-left:4px solid var(--blue); background:var(--blue-light); border-radius:0 8px 8px 0; padding:8px 14px; margin-bottom:8px; font-size:14px;}
  .pitfall{border-left:4px solid var(--gold); background:var(--gold-bg); border-radius:0 8px 8px 0; padding:8px 14px; margin-bottom:8px; font-size:14px;}
  .model-pres{background:#f7f9fc; border:1px solid var(--line); border-radius:8px; padding:14px 16px; font-size:14px; white-space:pre-wrap;}

  /* ---------- 5-step guide ---------- */
  .gstep{border:1px solid var(--line); border-radius:9px; margin-bottom:10px; background:#fff; overflow:hidden;}
  .gstep .gh{background:var(--blue-light); padding:8px 12px; font-weight:700; color:var(--blue-dark); font-size:14px;}
  .gstep .gh .gsub{font-weight:400; color:var(--muted); font-size:12.5px;}
  .gstep .gb{padding:10px 14px; font-size:13.5px;}
  .gstep .gb ul{margin:6px 0 4px 20px;}
  .gstep .gb li{margin-bottom:3px;}
  .gquote{font-weight:600; color:var(--blue-dark); margin-top:8px; font-size:13px;}
  .gcredit{font-size:12px; color:var(--muted); text-align:right; margin-top:8px;}
  #guideModal{display:none; position:fixed; inset:0; background:rgba(15,30,50,.45); z-index:100;}
  #guideModal .gm-in{background:var(--bg); max-width:780px; margin:4vh auto; max-height:92vh; overflow-y:auto; border-radius:12px; padding:18px 22px; box-shadow:0 8px 40px rgba(0,0,0,.3);}
  .abc-block{border:1px solid #cfe0d6; background:#f2f9f5; border-radius:8px; padding:10px 12px; margin-top:4px; margin-bottom:10px;}
  .abc-block h4{font-size:13px; color:#0e6b46; margin-bottom:5px;}
  .abc-block .abc-sub{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .abc-item{display:flex; gap:8px; align-items:flex-start; padding:3px 2px; font-size:13px; cursor:pointer;}
  .abc-item input{margin-top:3px; flex-shrink:0;}
  .abc-row{margin-bottom:7px;}
  .abc-note{display:block; width:calc(100% - 24px); margin:2px 0 0 24px; border:1px solid var(--line); border-radius:5px; font-size:12px; padding:3px 8px; background:#fff; font-family:inherit;}
  .abc-note:focus{outline:2px solid #9dbbe0; border-color:var(--blue);}
  .foundtag{font-size:11px; color:var(--accent); border:1px solid #b5dccc; background:#eef8f4; border-radius:9px; padding:1px 7px; margin-left:8px; white-space:nowrap;}

  @media (max-width: 980px){
    .sim-cols{flex-direction:column; height:auto;}
    #chartpane{border-right:none; border-bottom:2px solid var(--line);}
    #tabbody{max-height:60vh;}
    #tplpane{max-width:none;}
    #banner{position:static;}
  }
  @media print{ #topbar,#tplfoot,.btn{display:none;} }
</style>
</head>
<body>

<div id="topbar">
  <h1>ICU Pre-Rounding Simulator</h1>
  <span class="sub">EM Intern Workshop &middot; fictional patients</span>
  <span class="spacer"></span>
  <span id="timer">00:00</span>
  <button class="topbtn" onclick="showGuide()">5-Step Guide</button>
  <button class="topbtn" onclick="goPatientList()">Patient List</button>
</div>

<div id="app"></div>
<div id="guideModal" onclick="if(event.target===this)hideGuide()"><div class="gm-in"></div></div>

<script>

   TEMPLATE FIELDS (same structure for every case)

   ph:"MAP trend, pressor doses over the night (trajectory), rhythm, fluid balance..."},

   ph:"Diet/tube feeds (at goal? NPO and why?), bowel function and bowel regimen, LFTs, GI bleeding..."},

   ph:"Hgb/platelet trends, transfusions and thresholds, coags, anticoagulation, DVT prophylaxis..."},

   ph:"Each antibiotic and its day #, culture results and what's pending, Tmax/temp curve, WBC trend..."},

   ph:"Glucose range, insulin coverage, steroid dose and day #..."},

   ph:"Wounds, pressure areas, injuries, mobility..."}

/* =====================================================================
   CASE DATA
===================================================================== */
const CASES = [

  ],
  gib: [
    ["hgb|hemoglobin|6\\.9|melena", "transfus|prbc|unit|7\\.9"],                        // Hgb loop
    ["egd|endoscop|scope", "consent|capacity|surrogate"],                               // EGD consent
    ["encephalopath|asterixis|confus|ammonia|lactulose", "withdraw|ciwa|benzo|competing|lactulose"], // HE vs withdrawal
    ["airway|aspirat|intubat", "protect|risk|egd|mental"],                              // airway planning
    ["propranolol|beta.?block", "blunt|held|hold|tachy|heart rate|underestimat"],       // propranolol context
    ["restrict|threshold|over.?transfus", "\\b7\\b|portal|transfus"],                   // restrictive strategy
    ["inr|platelet|plt|coag", "1\\.8|8[48]|cirrho|correct|ffp|crossmatch"],             // coagulopathy
    ["bun", "36|blood|creat|ratio|gut|digest"],                                         // BUN/Cr pattern
    ["octreotide", "pantoprazole|ppi|ceftriaxone|protonix"],                            // bleed bundle
    ["propranolol|spironolactone|home", "held|hold"],                                   // home meds held
    ["18g|large.?bore|access|crossmatch|type and", "patent|active|2 unit|ahead|\\biv\\b"] // access/products
  ]
};
function autoMatches(c){
  const tpl = load(tplKey(c.id), {});
  const rawAbc = load(abcKey(c.id), null);
  const abcNotes = (rawAbc && !Array.isArray(rawAbc) && rawAbc.n) ? rawAbc.n.join(" ") : "";
  const text = TPL_FIELDS.map(f=>tpl[f.id]||"").join(" ") + " " + abcNotes;
  if(!text.trim()) return c.checklist.map(()=>false);
  const kws = KEYWORDS[c.id] || [];
  return c.checklist.map((_,i)=>{
    const groups = kws[i];
    if(!groups) return false;
    return groups.every(g=>{ try{ return new RegExp(g,"i").test(text); }catch(e){ return false; } });
  });
}

===================================================================== */
const SYS_GROUPS = [
  ["neuro","🧠 Neuro"], ["cv","❤️ CV"], ["resp","🫁 Resp"], ["renal","💧 Renal"],
  ["gi","🍽️ GI / Nutrition"], ["heme","🩸 Heme/Onc"], ["id","🦠 ID"], ["endo","⚖️ Endo"],
  ["msk","🔧 MSK / Skin"], ["lib","✅ ICU Liberation checklist"]
];
function goScore(){
  const c = currentCase;
  const tpl = load(tplKey(c.id), {});
  const auto = autoMatches(c);
  const prior = load(chkKey(c.id), null);
  const checks = prior || auto;
  app().innerHTML = `
  <div class="wrap">
    <div class="card">
      <h2>Check your work: ${esc(c.listName)}</h2>
      <p>Below is the gold-standard list of what a strong pre-round on this patient would capture. Your template text was scanned for each item (common abbreviations included); anything found is pre-checked and tagged <span class="foundtag">found in your notes</span>. The scan is imperfect, so correct it in both directions: check anything you captured that it missed, and uncheck anything you did not actually have. Your template answers are shown underneath for reference.</p>
    </div>
    <div class="card">
      <h3>Gold-standard items (by system)</h3>
      ${SYS_GROUPS.map(([sys,label])=>{
        if(!c.checklist.some(it=>it.sys===sys)) return "";
        return `<div class="chk-cat">${esc(label)}</div>` +
        c.checklist.map((it,i)=> it.sys!==sys ? "" : `
          <div class="chk-item">
            <input type="checkbox" id="ck_${i}" ${checks[i]?"checked":""} onchange="saveChk()">
            <label for="ck_${i}">${esc(it.text)}${auto[i]?'<span class="foundtag">found in your notes</span>':""}</label>
          </div>`).join("");
      }).join("")}
      <div style="margin-top:16px; display:flex; gap:10px;">
        <button class="btn" onclick="goResults()">Show my results</button>
        <button class="btn secondary" onclick="renderSim()">Back to the chart</button>
      </div>
    </div>
    <div class="card">
      <h3>Your template answers (for reference)</h3>
      <div class="answers-review">
        ${TPL_FIELDS.map(f=>`<h4>${esc(f.label)}</h4><div class="ans ${tpl[f.id]?"":"empty"}">${tpl[f.id]?esc(tpl[f.id]):"(left blank)"}</div>`).join("")}
      </div>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
function saveChk(){
  const c = currentCase;
  const arr = c.checklist.map((_,i)=> !!($("ck_"+i) && $("ck_"+i).checked));
  store(chkKey(c.id), arr);
}
function goResults(){
  saveChk();
  const c = currentCase;
  const checks = load(chkKey(c.id), []);
  const total = c.checklist.length;
  const got = checks.filter(Boolean).length;
  store(doneKey(c.id), {got, total});
  const missed = c.checklist.filter((_,i)=>!checks[i]);
  const hit = c.checklist.filter((_,i)=>checks[i]);
  app().innerHTML = `
  <div class="wrap">
    <div class="card" style="text-align:center;">
      <h2>${esc(c.listName)}: pre-round results</h2>
      <div class="score-big">${got} / ${total}</div>
      <p class="muted">${got===total?"Complete pre-round. Nothing slipped past you.":
        got>=total*0.75?"Strong pre-round. Review what you missed below.":
        got>=total*0.5?"Decent start. The missed items below are the habit-builders.":
        "This is why we practice. Read every missed item and its reasoning, then try another case."}</p>
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:16px; flex-wrap:wrap;">
      <button class="btn secondary" onclick="goScore()">Back to my checklist</button>
      <button class="btn secondary" onclick="renderSim()">Revisit this chart</button>
      <button class="btn" onclick="goHome()">Patient list</button>
    </div>
    <div class="card">
      <h3>By system</h3>
      ${SYS_GROUPS.map(([sys,label])=>{
        const items = c.checklist.map((it,i)=>({it,i})).filter(o=>o.it.sys===sys);
        if(!items.length) return "";
        const g = items.filter(o=>checks[o.i]).length;
        return `<div class="catbar"><span class="cb-label">${esc(label)}</span>
          <span class="cb-track"><span class="cb-fill" style="width:${items.length?Math.round(100*g/items.length):0}%"></span></span>
          <span class="cb-num">${g}/${items.length}</span></div>`;
      }).join("")}
    </div>
    ${missed.length?`<div class="card">
      <h3>What you missed, and why it matters</h3>
      ${missed.map(it=>`<div class="missed"><div class="mt">${esc(it.text)}</div><div class="mw">${esc(it.why)}</div></div>`).join("")}
    </div>`:""}
    ${hit.length?`<div class="card">
      <h3>What you caught</h3>
      ${hit.map(it=>`<div class="gotit">${esc(it.text)}</div>`).join("")}
    </div>`:""}
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:30px;">
      <button class="btn" onclick="goHome()">Back to patient list</button>
      <button class="btn secondary" onclick="renderSim()">Revisit this chart</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

  facDebrief = false;
  app().innerHTML = `
  <div class="wrap">
    <div class="fac-banner">FACILITATOR VIEW: contains answers. Do not project until the group is ready to debrief.</div>
    <div class="card">
      <h2>Facilitator debrief</h2>
      <p>Suggested flow per case (~15 min): (1) ask one intern to present their pre-round as if on rounds, (2) reveal the gold-standard checklist and let the group compare, (3) walk the planted pitfalls, (4) run the discussion questions, (5) read or project the model presentation.</p>
    </div>
    <div class="case-grid">
      ${CASES.map(c=>`<div class="case-card">
        <span class="bed">${esc(c.bed)}</span>
        <span class="nm">${esc(c.listName)}</span>
        <span class="dx">${esc(c.dxTeaser)}</span>
        <button class="btn" onclick="renderDebrief('${c.id}')">Open debrief</button>
      </div>`).join("")}
    </div>
  </div>`;
  window.scrollTo(0,0);
}
function renderDebrief(id){
  const c = caseById(id);
  facDebrief = true;
  app().innerHTML = `
  <div class="wrap">
    <div class="fac-banner">FACILITATOR VIEW: ${esc(c.listName)} (${esc(c.dxTeaser)})</div>
    <div class="card">
      <h3>Planted pitfalls (what this case is designed to teach)</h3>
      ${c.debrief.pitfalls.map(x=>`<div class="pitfall">${esc(x)}</div>`).join("")}
    </div>
    <div class="card">
      <h3>Gold-standard checklist with teaching rationale (by system)</h3>
      ${SYS_GROUPS.map(([sys,label])=>{
        const items = c.checklist.filter(it=>it.sys===sys);
        if(!items.length) return "";
        return `<div class="chk-cat">${esc(label)}</div>` + items.map(it=>
          `<div class="missed" style="border-left-color:var(--blue); background:var(--blue-light);">
             <div class="mt">${esc(it.text)}</div><div class="mw">${esc(it.why)}</div></div>`).join("");
      }).join("")}
    </div>
    <div class="card">
      <h3>Teaching pearls</h3>
      ${c.debrief.pearls.map(x=>`<div class="pearl">${esc(x)}</div>`).join("")}
    </div>
    <div class="card">
      <h3>Discussion questions</h3>
      <ul class="tight">${c.debrief.discussion.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3>Model pre-rounds presentation</h3>
      <div class="model-pres">${esc(c.debrief.model)}</div>
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:30px;">
      <button class="btn secondary" onclick="renderFacilitatorList()">All cases</button>
      <button class="btn" onclick="goHome()">Exit facilitator view</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

goHome();
</script>
</body>
</html>
